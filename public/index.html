<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANTTO - Inicio</title>
    <!-- Aquí se deberán enlazar los estilos globales cuando se extraigan -->
    <!-- <link rel="stylesheet" href="src/styles/global.css"> -->
    <style>
        :root {
            --primary-dark: #142C32;
            --bg-light: #F3F5F2;
            --text-dark: #142C32;
            --accent-lime: #D5F66A;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .brand {
            color: var(--primary-dark);
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: var(--accent-lime);
            color: var(--primary-dark);
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            transition: opacity 0.2s;
        }
        .btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">MANTTO</div>
        <p>Bienvenido al Sistema de Supervisión Industrial</p>
        <a href="src/pages/dashboard/dashboard.html" class="btn">Ir al Dashboard</a>
    </div>
</body>
</html>
